name: stock_management_app
description: "Modern ve kullanıcı dostu stok takip uygulaması"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.1
  get: ^4.6.6

  # Local Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  path: ^1.8.3

  # Barcode & Camera
  mobile_scanner: ^5.2.3
  camera: ^0.10.5+5

  # Excel Operations
  excel: ^4.0.6
  file_picker: ^8.1.2
  path_provider: ^2.1.4

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1

  # Charts - Updated to latest version for Flutter 3.32+ compatibility
  syncfusion_flutter_charts: ^30.2.6

  # Network & Connectivity
  connectivity_plus: ^5.0.2
  dio: ^5.4.0

  # Permissions
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Date & Time
  intl: ^0.18.1

  # Utils
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
